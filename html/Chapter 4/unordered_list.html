<!DOCTYPE html>
<html>
    <body>
        <h1>An unordered list</h1>
        <!-- By default list will be marked with bullets-->
        <ul type="disc">
            <li>Coffee</li>
            <li>Milk</li>
            <li>Tea</li>
        </ul>
        <br>

        <!-- Here list will be marked with circles-->
        <ul type="circle">
            <li>Coffee</li>
            <li>Milk</li>
            <li>Tea</li>
        </ul>
        <br>

        <!-- Here list will be marked with squares-->
        <ul type="square">
                <li>Coffee</li>
                <li>Milk</li>
                <li>Tea</li>
        </ul>
        <br>
        
        <!-- Here list will be marked with none-->
        <ul type="none">
            <li>Coffee</li>
            <li>Milk</li>
            <li>Tea</li>
        </ul>
    </body>
</html>
