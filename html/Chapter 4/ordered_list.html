<!DOCTYPE html>
<html>
    <body>
        <h1>An ordered list</h1>
        <!-- By default list will be marked with numbers-->
        <ol type>
            <li>Coffee</li>
            <li>Milk</li>
            <li>Tea</li>
        </ol>
        <br>

        <!-- Here list will be marked with uppercase roman numbers-->
        <ol type="I">
            <li>Coffee</li>
            <li>Milk</li>
            <li>Tea</li>
        </ol>
        <br>

        <!-- Here list will be marked with lowercase roman numbers-->
        <ol type="i">
                <li>Coffee</li>
                <li>Milk</li>
                <li>Tea</li>
        </ol>
        <br>
        
        <!-- Here list will be marked with uppercase alphabets-->
        <ol type="A">
            <li>Coffee</li>
            <li>Milk</li>
            <li>Tea</li>
        </ol>
        <br>

        <!-- Here list will be marked with lowercase alphabets-->
        <ol type="a">
            <li>Coffee</li>
            <li>Milk</li>
            <li>Tea</li>
        </ol>
    </body>
</html>
