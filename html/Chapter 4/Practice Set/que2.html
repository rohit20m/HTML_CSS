<!DOCTYPE html>
<html>

<head>
    <title>Form</title>
</head>

<body>
    <h1>Vacation Travel Form</h1>
    <form action="thanks.html">
        <label for="fname">First Name:-</label>
        <input type="text" id="fname" name="fname">
        <br>
        <br>

        <label for="mname">Middle Name:-</label>
        <input type="text" id="mname" name="mname">
        <br>
        <br>

        <label for="lname">Last Name:-</label>
        <input type="text" id="lname" name="lname">
        <br>
        <br>

        <label for="age">Age:-</label>
        <input type="number" id="age" name="age">
        <br>
        <br>

        <label for="contact">Contact Number:-</label>
        <input type="tel" id="contact" name="contact">
        <br>
        <br>

        <p>Gender:-</p>
        <label for="male">Male</label>
        <input type="radio" id="male" name="gender">
        <br>

        <label for="female">FeMale</label>
        <input type="radio" id="female" name="gender">
        <br>

        <label for="others">Others</label>
        <input type="radio" id="others" name="gender">
        <br>
        <br>

        <p>Where do you want to travel?:-</p>
        <label for="london">London</label>
        <input type="checkbox" id="london" name="london">
        <br>

        <label for="paris">Paris</label>
        <input type="checkbox" id="paris" name="paris">
        <br>

        <label for="goa">Goa</label>
        <input type="checkbox" id="goa" name="goa">
        <br>
        <br>
        <label for="ticket">How many tickets?</label>
        <select name="members" id="ticket">
            <option value="none">--Choose any one--</option>
            <option value="one">1</option>
            <option value="two">2</option>
            <option value="three">3</option>
        </select>
        <br>
        <br>

        <label for="date">Date of travelling:-</label>
        <input type="datetime-local" id="date" name="date">
        <br>
        <br>

        <label for="feedback">Feedback:-</label>
        <textarea type="text" id="feedback" placeholder="write your text Here" width="30" height="30"></textarea>
        <br>
        <br>

        <input type="submit" value="Submit">

        <input type="reset" value="Reset">
    </form>
</body>

</html>
