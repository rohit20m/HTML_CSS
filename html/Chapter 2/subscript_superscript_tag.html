<!DOCTYPE html>
<html>
    <body>
        <!--Example of Subscript tags-->
        <p>CO<sub>2</sub></p>
        <p>CO<sub>2</sub> + SO<sub>3</sub></p>

        <hr>

        <!--Example of Superscript tags-->
        <p>a<sup>2</sup></p>
        <p>ax<sup>3</sup> + bx<sup>2</sup> + c</p>
    </body>
</html>
