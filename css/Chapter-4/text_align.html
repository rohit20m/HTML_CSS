<!DOCTYPE html>
<html>

<head>
    <title>Text Align</title>
    <style>
        div {
            background-color: aqua;
        }
        
        .a {
            text-align: center;
            color: rebeccapurple;
        }
        
        .b {
            text-align: left;
            color: red;
        }
        
        .c {
            text-align: right;
            color: blue;
        }
        
        .d {
            text-align: justify;
            color: black;
        }
        
        h1 {
            color: brown;
        }
    </style>
</head>

<body>
    <h1>Text-Alignment Properties</h1>
    <div class="a">Rohit</div>

    <div class="b">Rohit</div>

    <div class="c">Rohit</div>

    <div class="d">Lorem ipsum dolor sit, amet consectetur adipisicing elit. Ipsa itaque commodi dolor harum amet minus incidunt. Laudantium atque architecto ipsa!</div>
</body>

</html>
