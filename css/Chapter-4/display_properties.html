<!DOCTYPE html>
<html>

<head>
    <title>Display Properties</title>
    <style>
        p {
            color: aqua;
        }
        
        p.ex1 {
            display: none;
        }
        
        p.ex2 {
            display: inline;
        }
        
        p.ex3 {
            display: block;
        }
        
        p.ex4 {
            display: inline-block;
            visibility: hidden;
            padding: 2px;
            margin: 4px;
        }
        
        div {
            background-color: rebeccapurple;
        }
    </style>
</head>

<body>
    <h1>The Display Properties</h1>
    <h2>display:none</h2>
    <div>Lorem ipsum dolor sit amet.
        <p class="ex1">HI</p>HELLO</div>

    <h2>display:inline</h2>
    <div>Lorem ipsum dolor sit amet.
        <p class="ex2">HI</p>HELLO</div>

    <h2>display:block</h2>
    <div>Lorem ipsum dolor sit amet.
        <p class="ex3">HI</p>HELLO</div>

    <h2>display:inline-block</h2>
    <div>Lorem ipsum dolor sit amet.
        <p class="ex4">HI</p>HELLO</div>
</body>

</html>
