<!DOCTYPE html>
<html>

<head>
    <title>decoration</title>
    <style>
        h1 {
            text-decoration: overline wavy black;
            color: red;
            background-color: darkcyan;
        }
        
        h2 {
            text-decoration: line-through double black;
            color: green;
            background-color: aqua;
        }
        
        h3 {
            text-decoration: underline dotted black;
            color: blue;
            background-color: darksalmon;
        }
        
        h4 {
            text-decoration: overline underline black;
            color: darkcyan;
            background-color: silver;
        }
    </style>
</head>

<body>
    <h1>ROHIT</h1>
    <hr>

    <h2>ROHIT</h2>
    <hr>

    <h3>ROHIT</h3>
    <hr>

    <h4>ROHIT</h4>
    <hr>

</body>

</html>
