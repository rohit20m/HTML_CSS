<!DOCTYPE html>
<html>

<head>
    <style>
        .a {
            text-transform: uppercase;
        }
        
        .b {
            text-transform: lowercase;
        }
        
        .c {
            text-transform: capitalize;
        }
        
        div {
            background-color: aqua;
            color: red;
        }
        
        h1 {
            text-decoration: underline double black;
            color: red;
        }
    </style>
</head>

<body>
    <h1>Text-Transform Property</h1>
    <div class="a">Lorem ipsum dolor sit amet.</div>
    <div class="b">Lorem ipsum dolor sit amet.</div>
    <div class="c">Lorem ipsum dolor sit amet.</div>
</body>

</html>
