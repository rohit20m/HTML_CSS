<!DOCTYPE html>
<html>
    <head>
        <style>
            /*Element selector*/
            h1,h2
            {
                color: red;
            }

            /*Id selector*/
            #green
            {
                color: greenyellow;
            }

            /*Class selector*/
            span.blue
            {
                color:lightsalmon;
            }

            *
            {
                text-align: center;
                margin:0;
                padding:0;
            }
        </style>
    </head>

    <body>
        <h1>This is a heading</h1>
        <h2>This is a heading</h2>
        <div id="green">This is block-level element</div>
        <span class="blue">This is inline element</span>
    </body>
</html>
