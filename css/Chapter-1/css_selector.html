<!DOCTYPE html>
<html>
    <head>
        <title>CSS Selectors</title>
        <style>
            body
            {
                background-color: cyan;        
            }
            
            div
            {
                background-color: blueviolet;
            }

            h1
            {
                color: deeppink;
            }

            h2
            {
                color: gold;
            }

            p
            {
                color: silver;
            }
        </style>
    </head>

    <body>
        <div>
            <h1>This is a heading</h1>
            <h2>This is another heading</h2>
            <p>This is a paragraph</p>
        </div>
    </body>
</html>
