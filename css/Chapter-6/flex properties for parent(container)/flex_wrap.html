<!DOCTYPE html>
<html>

<head>
    <title>flexbox</title>

    <style>
        * {
            margin: 0;
            padding: 0;
        }
        
        .container {
            display: flex;
            flex-wrap: wrap-reverse;
        }
        
        .box1 {
            background-color: red;
            width: 300px;
            height: 300px;
            border: 2px solid black;
        }
        
        .box2 {
            background-color: green;
            width: 300px;
            height: 300px;
            border: 2px solid black;
        }
        
        .box3 {
            background-color: blueviolet;
            width: 300px;
            height: 300px;
            border: 2px solid black;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="box1">box1</div>
        <div class="box2">box2</div>
        <div class="box3">box3</div>
    </div>
</body>

</html>
