<!DOCTYPE html>
<html>

<head>
    <title>float</title>

    <style>
        * {
            margin: 0;
            padding: 0;
        }
        
        .box1 {
            background-color: red;
            width: 300px;
            height: 300px;
            border: 4px solid black;
            float: right;
        }
        
        .box2 {
            background-color: blue;
            width: 300px;
            height: 300px;
            border: 4px solid black;
            float: right;
        }
    </style>
</head>

<body>
    <div class="box1">box1</div>
    <div class="box2">box2</div>
</body>

</html>
