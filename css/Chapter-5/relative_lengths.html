<!DOCTYPE html>
<html>

<head>
    <style>
        .em {
            background-color: red;
            font-size: 2em;
            width: 4em;
            height: 4em;
            border: 2px solid black;
        }
        
        .rem {
            background-color: green;
            font-size: 1rem;
            width: 4rem;
            height: 4rem;
            border: 2px solid black;
        }
        
        .vw {
            background-color: aqua;
            font-size: 10vw;
            border: 2px solid black;
        }
        
        .vh {
            background-color: green;
            font-size: 10vh;
            border: 2px solid black;
        }
    </style>
</head>

<body>
    <hr>
    <h3>font-size:em</h3>
    <div class="em">Lorem, ipsum dolor.</div>
    <br>
    <hr>
    <h3>font-size:rem</h3>
    <div class="rem">Lorem, ipsum dolor.</div>
    <br>
    <hr>
    <h3>font-size:viewport width</h3>
    <div class="vw">rohit</div>
    <br>
    <hr>
    <h3>font-size:viewport height</h3>
    <div class="vh">rohit</div>
    <br>
    <hr>
</body>

</html>
