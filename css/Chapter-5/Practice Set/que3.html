<!DOCTYPE html>
<html>

<head>
    <title>Q3</title>

    <style>
        ul.a {
            list-style-type: circle;
        }
        
        ul.b {
            list-style-type: square;
        }
        
        ul.c {
            list-style-type: upper-roman;
        }
        
        ul.d {
            list-style-type: lower-alpha;
        }
    </style>
</head>

<body>
    <h1>The list-style property</h1>
    <p>The list-style is a shorthand property to all the properties</p>

    <ul class="a">
        <li>Coffee</li>
        <li>Tea</li>
        <li>Milk</li>
    </ul>

    <ul class="b">
        <li>Coffee</li>
        <li>Tea</li>
        <li>Milk</li>
    </ul>

    <ul class="c">
        <li>Coffee</li>
        <li>Tea</li>
        <li>Milk</li>
    </ul>

    <ul class="d">
        <li>Coffee</li>
        <li>Tea</li>
        <li>Milk</li>
    </ul>
</body>

</html>
