<!DOCTYPE html>
<html>

<head>
    <title>
        The Position Property
    </title>

    <style>
        .relative {
            position: relative;
            border: 2px solid black;
            background-color: aqua;
            top: 12px;
            left: 5px;
            width: 500px;
        }
    </style>
</head>

<body>
    <h1>Position: relative</h1>
    <p>An element with Position static is positioned in a special way like we can add top, bottom, left and right positions.</p>

    <div class="relative">This is a div element with position:relative</div>
</body>

</html>
