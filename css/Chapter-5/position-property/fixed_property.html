<!DOCTYPE html>
<html>

<head>
    <style>
        .fixed {
            background-color: aqua;
            width: 300px;
            bottom: 0;
            left: 0;
            position: fixed;
            border: 2px solid black;
        }
    </style>
</head>

<body>
    <h1>Position: Fixed</h1>
    <p>An element with position fixed stays in a same place even page is scrolled and we can use right, left, top and bottom positions.</p>

    <div class="fixed">This is a div element with position: fixed</div>
</body>

</html>
