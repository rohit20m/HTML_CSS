<!DOCTYPE html>
<html>

<head>
    <style>
        .relative {
            width: 400px;
            height: 200px;
            background-color: aqua;
            border: 2px solid black;
            position: relative;
        }
        
        .absolute {
            position: absolute;
            bottom: 0px;
            right: 0;
            width: 200px;
            height: 100px;
            border: 2px solid black;
        }
    </style>
</head>

<body>
    <h1>Position: Absolute</h1>
    <p>An element is positioned according to the closest ancestor and not to the the relative viewport.</p>

    <div class="relative">This div element with position: relative.
        <div class="absolute">This div element with position: absolute.</div>
    </div>
</body>

</html>
