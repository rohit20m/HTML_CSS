<!DOCTYPE html>
<html>

<head>
    <title>
        The Position Property
    </title>

    <style>
        .static {
            position: static;
            border: 2px solid black;
            background-color: aqua;
        }
    </style>
</head>

<body>
    <h1>Position: static</h1>
    <p>An element with Position static is not positioned in a special way, it always positioned according to the flow of the page.</p>

    <div class="static">This is a div element with position:static</div>
</body>

</html>
