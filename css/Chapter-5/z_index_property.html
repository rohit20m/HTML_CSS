<!DOCTYPE html>
<html>

<head>
    <title>Z-index</title>
    <style>
        h1 {
            text-decoration: underline red;
        }
        
        .container {
            position: relative;
        }
        
        .redbox {
            position: relative;
            height: 200px;
            background-color: lightcoral;
            border: 2px solid black;
            margin: 30px;
            z-index: 4;
        }
        
        .bluebox {
            position: absolute;
            bottom: 0;
            width: 20%;
            height: 70px;
            background-color: lightblue;
            border: 2px solid black;
            z-index: 12;
        }
        
        .greenbox {
            position: absolute;
            bottom: 5px;
            width: 50%;
            height: 30px;
            background-color: lightgreen;
            border: 2px solid black;
            z-index: 33;
        }
    </style>
</head>

<body>
    <h1>Z-index Property</h1>

    <div class="container">
        <div class="redbox">This is a red box</div>
        <div class="bluebox">This is a blue box</div>
        <div class="greenbox">This is a green box</div>
    </div>
</body>

</html>
