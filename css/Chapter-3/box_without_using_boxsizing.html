<!DOCTYPE html>
<html>

<head>
    <title>Box</title>

    <style>
        .div1 {
            color: red;
            background-color: aqua;
            width: 300px;
            height: 100px;
            border: 4px solid black;
        }
        
        .div2 {
            color: greenyellow;
            background-color: royalblue;
            width: 300px;
            height: 100px;
            border: 4px solid black;
            padding: 50px;
        }
    </style>
</head>

<body>
    <h1>Box without using box-sizing properties.</h1>
    <div class="div1">This is div is smaller beacuse it has width 300px and height 200px.</div>
    <div class="div2">This div is bigger beacuse it has padding property of 50px.</div>
</body>

</html>
