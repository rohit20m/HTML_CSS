<!DOCTYPE html>>
<html>

<head>
    <title>CSS Padding</title>
    <style>
        .padding {
            color: red;
            background-color: sandybrown;
            padding-top: 50px;
            padding-right: 50px;
            padding-bottom: 50px;
            padding-left: 50px;
            /* padding: 50px 30px 40px 20px; */
            border: 4px dashed blue;
        }
        
        body {
            background-color: black;
        }
    </style>
</head>

<body>
    <div class="padding">This element has a padding of 100 px at top,right,bottom,left</div>
</body>

</html>
