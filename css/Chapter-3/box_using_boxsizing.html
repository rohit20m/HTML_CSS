<!DOCTYPE html>
<html>

<head>
    <title>Box</title>

    <style>
        .div1 {
            color: red;
            background-color: aqua;
            width: 300px;
            height: 100px;
            border: 4px solid black;
            box-sizing: border-box;
        }
        
        .div2 {
            color: greenyellow;
            background-color: royalblue;
            width: 300px;
            height: 100px;
            border: 4px solid black;
            padding: 50px;
            box-sizing: border-box;
        }
    </style>
</head>

<body>
    <h1>Box without using box-sizing properties.</h1>
    <div class="div1">Both divs are of same size now.</div>
    <div class="div2">Hello world.</div>
</body>

</html>
