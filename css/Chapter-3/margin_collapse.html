<!DOCTYPE html>
<html>

<head>
    <title>Margin Collapse</title>
    <style>
        h1 {
            color: red;
            background-color: aqua;
            margin: 0 0 50px 0;
            border: 4px solid black;
        }
        
        h2 {
            color: green;
            background-color: darkblue;
            margin: 20px 0 0 0;
            border: 4px solid black;
        }
    </style>
</head>

<body>
    <b>In this example h1 has a bottom margin of 50px and h2 has a top margin of 20px.So,the vertical margin between h1 and h2 should have been 70 px but,due to the margin collapse the actual margin between h1 and h2 end up being 50px.</b>
    <br>
    <br>
    <br>
    <br>
    <h1>This is a heading 1</h1>
    <h2>This is a heading 2</h2>
</body>

</html>
