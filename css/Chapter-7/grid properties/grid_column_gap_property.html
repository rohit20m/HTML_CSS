<!DOCTYPE html>
<html>

<head>
    <style>
        .container {
            background-color: aqua;
            display: grid;
            grid-column-gap: 4px;
            grid-template-columns: auto auto;
        }
        
        .item {
            background-color: red;
            border: 2px solid black;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="item">1</div>
        <div class="item">2</div>
        <div class="item">3</div>
        <div class="item">4</div>
        <div class="item">5</div>
    </div>
</body>

</html>
