<!DOCTYPE html>
<html>

<head>
    <title>Grid</title>

    <style>
        .container {
            display: grid;
            background-color: aqua;
        }
        
        .item {
            background-color: red;
            border: 2px solid black;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="item">1</div>
        <div class="item">2</div>
        <div class="item">3</div>
        <div class="item">4</div>
        <div class="item">6</div>
        <div class="item">7</div>
    </div>
</body>

</html>
