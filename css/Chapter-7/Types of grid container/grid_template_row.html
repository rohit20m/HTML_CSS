<!DOCTYPE html>
<html>

<head>
    <style>
        .container {
            display: grid;
            background-color: cyan;
            grid-row-gap: 4px;
            grid-template-rows: auto auto 300px;
        }
        
        .items {
            background-color: crimson;
            border: 3px solid black;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="items">A</div>
        <div class="items">B</div>
        <div class="items">C</div>
        <div class="items">D</div>
    </div>
</body>

</html>
