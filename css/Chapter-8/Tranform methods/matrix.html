<!DOCTYPE html>
<html>
<title>Matrix</title>

<head>
    <style>
        * {
            margin: 0;
            padding: 0;
        }
        
        .container {
            background-color: aqua;
            height: 50vh;
        }
        
        p {
            border: 2px solid black;
            transform: matrix(1, -0.3, 0, 1, 0, 0);
        }
    </style>
</head>

<body>
    <h2>Tranform Method:- Skew</h2>

    <div class="container">
        <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Dolorem dolorum rem in eveniet exercitationem! Molestias, reiciendis magnam. Qui eum perspiciatis hic ipsum ut eligendi dolor fugiat voluptatibus beatae amet. Voluptate.
        </p>
    </div>
</body>

</html>
