<!DOCTYPE html>
<html>
<title></title>

<head>
    <style>
        * {
            margin: 0;
            padding: 0;
        }
        
        div {
            width: 100px;
            height: 100px;
            background-color: red;
            border: 2px solid black;
            animation-name: mymove;
            animation-duration: 5s;
        }
        
        @keyframes mymove {
            from {
                width: 100px;
            }
            to {
                width: 700px;
            }
        }
    </style>
</head>

<body>
    <div></div>
</body>

</html>
