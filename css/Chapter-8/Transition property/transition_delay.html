<!DOCTYPE html>
<html>
<title>Transition Delay</title>

<head>
    <style>
        div {
            width: 100px;
            height: 100px;
            background-color: red;
            transition: width 2s, height 2s;
        }
        
        div:hover {
            width: 200px;
            height: 300px;
        }
    </style>
</head>

<body>
    <h1>Transition Delay</h1>

    <div></div>
</body>

</html>
