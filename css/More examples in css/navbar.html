<!DOCTYPE html>
<html>

<head>
    <title>Navbar</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            list-style: none;
            text-decoration: none;
        }
        
        nav {
            background-color: #000000;
            width: 100%;
            height: 100px;
        }
        
        ul {
            float: right;
            margin-right: 60px;
        }
        
        li {
            display: inline-block;
            line-height: 80px;
            color: white;
            margin: 0 3px;
        }
        
        a {
            color: whitesmoke;
            font-weight: 800;
            font-size: 20px;
            padding: 7px 13px;
            border-radius: 6px;
            text-transform: uppercase;
            font: 'Poppins', sans-serif;
        }
        
        a:hover {
            background-color: #1b9bff;
            transition: 0.7s;
        }
        
        @media screen and (max-width:900px) {
            a {
                font-size: 10px;
            }
        }
        
        @media screen and (max-width:800px) {
            ul {
                position: fixed;
                width: 100%;
                height: 100vh;
                background-color: #262626;
                top: 80px;
                left: -100%;
                text-align: center;
                transition: all 0.5s;
            }
            li {
                color: red;
                display: block;
                margin: 50px 0;
                line-height: 30px;
            }
            a {
                font-size: 20px;
            }
            a:hover {
                background-color: green;
                color: white;
            }
        }
    </style>
</head>

<body>
    <header>
        <nav>
            <ul type="none">
                <li><a href="#">Home</a></li>
                <li><a href="#">About</a></li>
                <li><a href="#">Services</a></li>
                <li><a href="#">Contact</a></li>
                <li><a href="#">Feedback</a></li>
            </ul>
        </nav>
    </header>
</body>

</html>
