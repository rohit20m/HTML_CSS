<!DOCTYPE html>
<html>

<head>
    <style>
        * {
            margin: 0px;
            padding: 0px;
        }
        
        body {
            /*displays iamge*/
            background-image: url("index.jpg");
            background-repeat: no-repeat;
            /*fits image as large as possible*/
            background-size: cover;
            /*fits image as large as possible within its container without cropping or stretching the image*/
            background-size: contain;
            /*displays in original size*/
            background-size: auto;
            /*displays width of the image*/
            background-size: 40%;
            /*displays width and height*/
            background-size: 1500px 800px;
            /*displays border*/
            border: 2px solid red;
        }
        
        p {
            width: 1000px;
            height: 1000px;
            color: red;
        }
    </style>
</head>

<body>
    <h1>Cristiano Ronaldo</h1>
    <p>Lorem, ipsum dolor sit amet consectetur adipisicing elit. Quo, numquam!</p>
</body>

</html>
