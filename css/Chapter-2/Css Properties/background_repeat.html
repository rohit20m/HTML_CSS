<!DOCTYPE html>
<html>

<head>
    <style>
        body {
            /*displays iamges*/
            background-image: url("index.jpg");
            /*displays only one iamge*/
            background-repeat: no-repeat;
            /*displays repeat images on x axis*/
            background-repeat: repeat-x;
            /*displays repeat images on y axis*/
            background-repeat: repeat-y;
            /*displays images with spaces between them*/
            background-repeat: space;
            /*repeats images as much as needed to cover the whole background image painting area*/
            background-repeat: round;
        }
    </style>
</head>

<body>
    <h1>Cristiano Ronaldo</h1>
</body>

</html>
